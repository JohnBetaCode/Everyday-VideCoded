services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: everyday2-dev
    volumes:
      - ..:/workspace
      - /media:/media:ro
      - /mnt:/mnt:ro
      - /run/media:/run/media:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: bash
